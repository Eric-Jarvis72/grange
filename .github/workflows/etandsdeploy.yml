name: ETANDS Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  DEPLOY_HOST: grange.etandspleaseunblock.fun
  DEPLOY_USER: grange
  DEPLOY_PATH: /home/grange/grange
  APP_PORT: "3200"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # The release bundles ERTS, so it only runs on a compatible OS/arch.
      - name: Set up Erlang/Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.20"

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend and release
        run: |
          pnpm build
          cd backend
          mix deps.get
          MIX_ENV=prod mix release

      - name: Load deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ETANDS_SSH_KEY }}

      - name: Trust host key
        run: ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Sync release
        run: |
          # --exclude=/data/ keeps runtime state (the SQLite database) from being
          # deleted when --delete prunes files absent from the release.
          rsync -az --delete --exclude=/data/ backend/_build/prod/rel/grange/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
          rsync -az deploy/deploy.sh "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/deploy.sh"

      - name: Restart
        run: ssh "$DEPLOY_USER@$DEPLOY_HOST" "APP_PORT=$APP_PORT APP_HOST=$DEPLOY_HOST bash $DEPLOY_PATH/deploy.sh"
